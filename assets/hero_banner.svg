<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>
  <rect x="2" y="2" width="1196" height="396" fill="none" stroke="#1e293b" stroke-width="2" rx="14"/>
  
  <!-- Flow lines -->
  <path d="M 150 200 Q 300 120 450 200 T 750 200 T 1050 200" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Nodes visual -->
  <g transform="translate(150, 200)">
    <circle r="36" fill="#0f172a" stroke="#0d9488" stroke-width="3"/>
    <text text-anchor="middle" dy="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">RESEARCH</text>
  </g>
  <g transform="translate(375, 200)">
    <circle r="36" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text text-anchor="middle" dy="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">HEADLINE</text>
  </g>
  <g transform="translate(600, 200)">
    <circle r="42" fill="#0f172a" stroke="#6366f1" stroke-width="3"/>
    <text text-anchor="middle" dy="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">WRITER</text>
  </g>
  <g transform="translate(825, 200)">
    <circle r="36" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
    <text text-anchor="middle" dy="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">VERIFIER</text>
  </g>
  <g transform="translate(1050, 200)">
    <circle r="36" fill="#0f172a" stroke="#ec4899" stroke-width="3"/>
    <text text-anchor="middle" dy="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">PUBLISH</text>
  </g>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    Autonomous Blog Generation Agent
  </text>
  <text x="600" y="125" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    LangGraph StateGraph &bull; Real-Time Fact Verification &bull; PostgreSQL 100x Architecture &bull; React Studio
  </text>
  
  <!-- Bottom bar -->
  <rect x="350" y="320" width="500" height="40" fill="#1e293b" rx="20"/>
  <text x="600" y="345" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="500">
    Python 3.11+ &bull; FastAPI &bull; Groq Llama 3.3 &bull; Astral UV
  </text>
</svg>
