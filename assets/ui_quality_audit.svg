  <text x="180" y="220" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="48" font-weight="800">9.2<tspan font-size="20" fill="#64748b">/10</tspan></text>
  <rect x="90" y="250" width="180" height="32" fill="#064e3b" rx="16"/>
  <text x="180" y="271" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STATUS: PASSED</text>
  <text x="180" y="320" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0 Critical Hallucinations</text>
  <text x="180" y="340" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0 Fabricated Commands</text>
  <text x="180" y="360" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Revisions: 0 (Passed on 1st attempt)</text>

  <!-- Audit Details Table -->
  <rect x="330" y="110" width="620" height="300" fill="#1e293b" rx="8" stroke="#334155"/>
  <text x="360" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Verification Breakdown</text>
  
  <rect x="360" y="165" width="560" height="40" fill="#0f172a" rx="4"/>
  <text x="380" y="190" fill="#38bdf8" font-family="monospace" font-size="12">[CLI Syntax Check]</text>
  <text x="540" y="190" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">&check; Verified valid CLI invocations from reference docs</text>

  <rect x="360" y="215" width="560" height="40" fill="#0f172a" rx="4"/>
  <text x="380" y="240" fill="#38bdf8" font-family="monospace" font-size="12">[Anti-Hedging Linter]</text>
  <text x="540" y="240" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">&check; 0 hedging excuses detected ("syntax may vary")</text>

  <rect x="360" y="265" width="560" height="40" fill="#0f172a" rx="4"/>
  <text x="380" y="290" fill="#38bdf8" font-family="monospace" font-size="12">[AI Cliché Filter]</text>
  <text x="540" y="290" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">&check; 0 banned phrases ("game-changer", "delve into")</text>

  <rect x="360" y="315" width="560" height="70" fill="#0f172a" rx="4"/>
  <text x="380" y="340" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Editorial Critique:</text>
  <text x="380" y="365" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">"Article demonstrates strong factual grounding in reference repository. Code examples match tested CLI syntax."</text>
