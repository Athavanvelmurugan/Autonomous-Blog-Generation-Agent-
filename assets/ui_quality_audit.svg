<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="auto">
  <rect width="1000" height="450" fill="#0f172a" rx="12"/>
  <rect x="2" y="2" width="996" height="446" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>
  
  <text x="50" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Fact-Check Quality Audit &amp; Hallucination Linter</text>
