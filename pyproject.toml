[project]
name = "blog-generation-agent"
version = "0.1.0"
description = "Autonomous Blog Generation Agent using LangGraph, FastAPI, and UV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.34",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.130",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "greenlet>=3.1.0",
    "duckduckgo-search>=6.0.0",
    "ddgs>=9.16.0",
    "pymupdf>=2.0",
    "langchain-community>=0.3.0",
    "alembic>=1.20.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "psycopg-binary>=3.3.6",
    "markdown>=3.11.2",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
